name: Hummingbird
options:
  createIntermediateGroups: true
  # 本地化（2026-11-14）：资源含 zh-Hans/en 两套 .lproj；开发语言设为 en，
  # 使「系统为其他语言」时回退英文（而非中文）。
  developmentLanguage: en
  knownRegions: [en, zh-Hans, Base]
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  Hummingbird:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - ScreenRecorder/Sources
      # P1b 点击音效资源：显式入 resources 构建段（wav 须随 app bundle 分发，
      # SCStreamRecorder 以 Bundle.main 装载）。
      - path: ScreenRecorder/Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        # bundle id 保持 com.screenrecorder.app（2026-11-14 裁定）：TCC 权限与
        # UserDefaults 均锚定它，更名会令用户需重授权限、丢设置。
        PRODUCT_BUNDLE_IDENTIFIER: com.screenrecorder.app
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9TF3XSQ3N
        # 产品名/模块名（2026-11-14 命名裁定）：编译产物、可执行、模块都是
        # Hummingbird；界面显示名仍是 CFBundleDisplayName「蜂鸟录屏」。
        PRODUCT_NAME: Hummingbird
        PRODUCT_MODULE_NAME: Hummingbird
    info:
      path: ScreenRecorder/Info.plist
      properties:
        LSUIElement: true
        # 显示名（2026-11-14 命名裁定）：「蜂鸟录屏」——蜂鸟悬停振翅、身体定格，
        # 是自然界最著名的「定格」意象（↔ 截图），高频振翅 ↔ 高帧率录制。
        # 只改显示名，不动 PRODUCT_BUNDLE_IDENTIFIER（TCC 权限与 UserDefaults 锚定它）。
        CFBundleDisplayName: 蜂鸟录屏
        CFBundleName: 蜂鸟录屏
        # App 主图标（2026-11-14）：绿渐变圆角底 + 白色摄像机（video.fill），
        # ScreenRecorder/Resources/AppIcon.icns 随 resources 段拷入 bundle。
        CFBundleIconFile: AppIcon
        NSMicrophoneUsageDescription: 用于录制会议和教程
        NSCameraUsageDescription: 用于录制会议和教程
        NSScreenRecordingUsageDescription: 用于录制会议和教程
        LSApplicationCategoryType: public.app-category.productivity
  HummingbirdTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - ScreenRecorderTests
    dependencies:
      - target: Hummingbird
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # 测试宿主＝产品名（Hummingbird；xcodegen 自动推导仍用 target 名，需显式覆盖）。
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hummingbird.app/Contents/MacOS/Hummingbird
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Hummingbird:
    build:
      targets:
        Hummingbird: all
    test:
      targets:
        - HummingbirdTests
      # 测试宿主语言固定简体中文（2026-11-14 本地化引入）：断言按源语言文案编写，
      # 不随开发机系统语言漂移（-testLanguage 同效，此处内置到 scheme）。
      language: zh-Hans
