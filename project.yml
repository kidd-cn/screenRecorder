name: ScreenRecorder
options:
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  ScreenRecorder:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - ScreenRecorder/Sources
      # P1b 点击音效资源：显式入 resources 构建段（wav 须随 app bundle 分发，
      # SCStreamRecorder 以 Bundle.main 装载）。
      - path: ScreenRecorder/Resources
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenrecorder.app
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q9TF3XSQ3N
    info:
      path: ScreenRecorder/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: 用于录制会议和教程
        NSCameraUsageDescription: 用于录制会议和教程
        NSScreenRecordingUsageDescription: 用于录制会议和教程
        LSApplicationCategoryType: public.app-category.productivity
  ScreenRecorderTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - ScreenRecorderTests
    dependencies:
      - target: ScreenRecorder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScreenRecorder:
    build:
      targets:
        ScreenRecorder: all
    test:
      targets:
        - ScreenRecorderTests
